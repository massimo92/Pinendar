services:
  pinendar:
    build:
      target: development
    command: ["uv", "run", "--locked", "uvicorn", "pinendar.main:app", "--host", "0.0.0.0", "--port", "4173", "--reload"]
    environment:
      PINENDAR_PASSWORD: ${PINENDAR_PASSWORD:-pinendar}
      PINENDAR_SESSION_SECRET: ${PINENDAR_SESSION_SECRET:-development-session-secret-change-me}
      PINENDAR_SECURE_COOKIES: "false"
      PINENDAR_SCHEDULER_PROCESS_POOL: "false"
    read_only: false
    restart: "no"
    volumes:
      - pinendar-dev-venv:/app/.venv
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./alembic
          target: /app/alembic
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

volumes:
  pinendar-dev-venv:
